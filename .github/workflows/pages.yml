# Publishes the shared AS Academy Web Viewer from the Core repository.
# Course repositories do not duplicate web UI code; the viewer reads each Course Package live from GitHub.
name: Academy Web Viewer

on:
  push:
    branches: [main]
    paths:
      - 'web-preview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: academy-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload universal web viewer
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-preview

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy universal web viewer
        id: deployment
        uses: actions/deploy-pages@v4
