name: Process Immutable Release Request

on:
  push:
    branches:
      - 'release-request/**'
    paths:
      - 'release/request.json'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release request
        uses: actions/checkout@v4
        with:
          path: request-repo

      - name: Validate release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="request-repo/release/request.json"
          VERSION="$(jq -er '.version' "${REQUEST_FILE}")"
          SHA="$(jq -er '.sha' "${REQUEST_FILE}")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable x.y.z versions can be released."
            exit 1
          fi
          if [[ ! "${SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "sha must be an exact 40-character commit SHA."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.sha }}
          fetch-depth: 0
          path: candidate

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce candidate identity and version
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.request.outputs.sha }}"
          PROJECT_VERSION="$(./gradlew -q properties | awk -F': ' '$1 == "version" { print $2; exit }')"
          EXPECTED_VERSION="${{ steps.request.outputs.version }}"
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Candidate resolved to ${ACTUAL_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi
          if [[ "${PROJECT_VERSION}" == *-SNAPSHOT ]]; then
            echo "Snapshot ${PROJECT_VERSION} cannot be released."
            exit 1
          fi
          if [[ "${PROJECT_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo "Candidate version ${PROJECT_VERSION} does not match request ${EXPECTED_VERSION}."
            exit 1
          fi

      - name: Verify existing tag or create immutable tag
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          TAG="${{ steps.request.outputs.tag }}"
          SHA="${{ steps.request.outputs.sha }}"
          git fetch --tags --force origin
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" != "${SHA}" ]]; then
              echo "Existing tag ${TAG} resolves to ${TAG_SHA}, expected ${SHA}. Refusing to continue."
              exit 1
            fi
            echo "Verified existing immutable tag ${TAG} at ${SHA}."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "AS Academy Foundation ${TAG}" "${SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Verify release candidate
        working-directory: candidate
        run: ./gradlew clean test publishToMavenLocal

      - name: Publish Course, Engine and Core to GitHub Packages
        working-directory: candidate
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository

      - name: Create GitHub Release if missing
        shell: bash
        working-directory: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.request.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
          else
            gh release create "${TAG}" --verify-tag --title "AS Academy Foundation ${TAG}" --generate-notes
          fi
