name: Process Immutable Release Request

on:
  push:
    branches:
      - 'release-request/**'
    paths:
      - 'release/request.json'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release request
        uses: actions/checkout@v4
        with:
          path: request-repo

      - name: Validate release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="request-repo/release/request.json"
          VERSION="$(jq -er '.version' "${REQUEST_FILE}")"
          SHA="$(jq -er '.sha' "${REQUEST_FILE}")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable x.y.z versions can be released."
            exit 1
          fi
          if [[ ! "${SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "sha must be an exact 40-character commit SHA."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.sha }}
          fetch-depth: 0
          path: candidate

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle without shared build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Enforce candidate identity and version
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.request.outputs.sha }}"
          PROJECT_VERSION="$(./gradlew -q properties --no-configuration-cache | awk -F': ' '$1 == "version" { print $2; exit }')"
          EXPECTED_VERSION="${{ steps.request.outputs.version }}"
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Candidate resolved to ${ACTUAL_SHA}, expected ${EXPECTED_SHA}."
            exit 1
          fi
          if [[ "${PROJECT_VERSION}" == *-SNAPSHOT ]]; then
            echo "Snapshot ${PROJECT_VERSION} cannot be released."
            exit 1
          fi
          if [[ "${PROJECT_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo "Candidate version ${PROJECT_VERSION} does not match request ${EXPECTED_VERSION}."
            exit 1
          fi

      - name: Verify existing tag or create immutable tag
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          TAG="${{ steps.request.outputs.tag }}"
          SHA="${{ steps.request.outputs.sha }}"
          git fetch --tags --force origin
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" != "${SHA}" ]]; then
              echo "Existing tag ${TAG} resolves to ${TAG_SHA}, expected ${SHA}. Refusing to continue."
              exit 1
            fi
            echo "Verified existing immutable tag ${TAG} at ${SHA}."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "AS Academy Foundation ${TAG}" "${SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Verify release candidate from isolated Gradle state
        working-directory: candidate
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/release-gradle-home
        run: ./gradlew clean test publishToMavenLocal --no-build-cache --no-configuration-cache

      - name: Publish or verify immutable GitHub Packages artifacts
        shell: bash
        working-directory: candidate
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_USER_HOME: ${{ runner.temp }}/release-gradle-home
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          BASE_URL="https://maven.pkg.github.com/waxew/AS-Academy-Core/com/asdevelopers/academy"

          publish_or_verify() {
            local artifact="$1"
            local extension="$2"
            local task="$3"
            local local_file="${HOME}/.m2/repository/com/asdevelopers/academy/${artifact}/${VERSION}/${artifact}-${VERSION}.${extension}"
            local remote_url="${BASE_URL}/${artifact}/${VERSION}/${artifact}-${VERSION}.${extension}"
            local remote_file
            remote_file="$(mktemp)"
            local http_code
            http_code="$(curl -sS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" -o "${remote_file}" -w '%{http_code}' "${remote_url}")"

            if [[ "${http_code}" == "200" ]]; then
              echo "${artifact}:${VERSION} already exists; verifying immutable bytes."
              cmp --silent "${local_file}" "${remote_file}" || {
                echo "Existing ${artifact}:${VERSION} differs from the verified local artifact. Refusing to overwrite."
                exit 1
              }
              return 0
            fi

            if [[ "${http_code}" != "404" ]]; then
              echo "Unable to verify ${artifact}:${VERSION}; GitHub Packages returned HTTP ${http_code}."
              exit 1
            fi

            ./gradlew "${task}" --no-build-cache --no-configuration-cache
            http_code="$(curl -sS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" -o "${remote_file}" -w '%{http_code}' "${remote_url}")"
            if [[ "${http_code}" != "200" ]]; then
              echo "Published ${artifact}:${VERSION} but could not read it back (HTTP ${http_code})."
              exit 1
            fi
            cmp --silent "${local_file}" "${remote_file}" || {
              echo "Published ${artifact}:${VERSION} does not match the verified local artifact."
              exit 1
            }
          }

          publish_or_verify course jar :course:publishCoursePublicationToGitHubPackagesRepository
          publish_or_verify engine jar :engine:publishEnginePublicationToGitHubPackagesRepository
          publish_or_verify core aar :core:publishReleasePublicationToGitHubPackagesRepository

      - name: Create GitHub Release if missing
        shell: bash
        working-directory: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.request.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
          else
            gh release create "${TAG}" --verify-tag --title "AS Academy Foundation ${TAG}" --generate-notes
          fi
