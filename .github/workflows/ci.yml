name: Core quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-and-content:
    name: Engine tests and course contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate foundation contract
        run: python3 integration/validate_contract.py

      - name: Validate integration course template
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("integration/contract.json").read_text())
          template = json.loads(Path("course/template/manifest.json").read_text())

          required = contract["courseManifestRequiredFields"]
          missing = [key for key in required if key not in template]
          if missing:
              raise SystemExit(f"Course template is missing required integration fields: {missing}")
          if template["contentSchemaVersion"] != contract["contentSchemaVersion"]:
              raise SystemExit(
                  f"Template schema {template['contentSchemaVersion']} does not match contract schema {contract['contentSchemaVersion']}"
              )
          if contract["android"] != {"minSdk": 23, "compileSdk": 36, "javaVersion": 17}:
              raise SystemExit("integration/contract.json Android baseline drifted from the supported Core baseline")
          print(f"Integration contract v{contract['contractVersion']} validated for Core {contract['coreVersion']}")
          PY

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run pure JVM tests
        run: ./gradlew :course:test :engine:test --stacktrace

      - name: Validate the editable course template
        run: ./gradlew :tools:run --args="validate course/template" --stacktrace

      - name: Compile the template into an Android-ready bundle
        run: ./gradlew :tools:run --args="compile course/template build/validated-course.json" --stacktrace

  android-runtime:
    name: Android runtime lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint the shared Android runtime
        run: ./gradlew :core:lintDebug --stacktrace

      # The official reference application lives in AS-Academy-MainUi/academy-viewer
      # and is assembled by Foundation Integration with all three repositories checked out.
