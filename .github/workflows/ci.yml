name: Core quality gates

on:
  push:
    branches: [main]
  pull_request:

# CI فقط محتوا را می‌خواند و هیچ مجوز نوشتن روی Repository ندارد.
permissions:
  contents: read

# اجرای جدید همان Branch، اجرای قدیمی را متوقف می‌کند تا نتیجه منسوخ گزارش نشود.
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-and-content:
    name: Engine tests and course contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run pure JVM tests
        run: ./gradlew :course:test :engine:test --stacktrace

      - name: Validate the editable course template
        run: ./gradlew :tools:run --args="validate course/template" --stacktrace

      - name: Compile the template into an Android-ready bundle
        run: ./gradlew :tools:run --args="compile course/template build/validated-course.json" --stacktrace

  android-runtime:
    name: Android lint and sample build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint the shared Android runtime
        run: ./gradlew :core:lintDebug --stacktrace

      - name: Build the reference application
        run: ./gradlew :sample-app:assembleDebug --stacktrace

      - name: Verify Room schema v4 was exported
        run: test -f core/schemas/com.asdevelopers.academy.core.database.AcademyDatabase/4.json

      - name: Upload generated Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: core/schemas
          if-no-files-found: error

  android-migration:
    name: Room migration instrumentation
    # Migration test بعد از Compile/Lint اجرا می‌شود تا خطاهای ساده Build قبل از روشن‌شدن Emulator متوقف شوند.
    needs: android-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run non-destructive Room migration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :core:connectedDebugAndroidTest --stacktrace
