name: Core quality gates

on:
  push:
    branches: [main, integration/mainui-maincourse]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-and-content:
    name: Engine tests and course contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run pure JVM tests
        run: ./gradlew :course:test :engine:test --stacktrace

      - name: Validate the editable course template
        run: ./gradlew :tools:run --args="validate course/template" --stacktrace

      - name: Compile the template into an Android-ready bundle
        run: ./gradlew :tools:run --args="compile course/template build/validated-course.json" --stacktrace

  android-runtime:
    name: Core unit tests, lint and sample build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Core unit tests
        run: ./gradlew :core:testDebugUnitTest --stacktrace

      - name: Lint the shared Android runtime
        run: ./gradlew :core:lintDebug --stacktrace

      - name: Build the reference application
        run: ./gradlew :sample-app:assembleDebug --stacktrace
