name: Foundation Integration

on:
  push:
    branches:
      - feat/foundation-v1-unification
      - integration/**
  pull_request:

jobs:
  three-repo-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          path: AS-Academy-Core

      - name: Checkout MainUi foundation branch
        uses: actions/checkout@v4
        with:
          repository: waxew/AS-Academy-MainUi
          ref: feat/foundation-v1-unification
          path: AS-Academy-MainUi

      - name: Checkout MainCourse main
        uses: actions/checkout@v4
        with:
          repository: waxew/AS-Academy-MainCourse
          ref: main
          path: AS-Academy-MainCourse

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce identical foundation contracts
        run: |
          cmp AS-Academy-Core/integration/contract.json AS-Academy-MainUi/integration/contract.json
          cmp AS-Academy-Core/integration/contract.json AS-Academy-MainCourse/integration/contract.json

      - name: Validate all three repositories
        run: |
          python AS-Academy-Core/integration/validate_contract.py
          python AS-Academy-MainUi/integration/validate_contract.py
          python AS-Academy-MainCourse/integration/validate_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Core
        working-directory: AS-Academy-Core
        run: |
          chmod +x gradlew
          ./gradlew :core:testDebugUnitTest

      - name: Build MainUi against checked-out Core
        working-directory: AS-Academy-MainUi
        env:
          ACADEMY_CORE_DIR: ../AS-Academy-Core
        run: |
          chmod +x ../AS-Academy-Core/gradlew
          ../AS-Academy-Core/gradlew -p . :main-ui:testDebugUnitTest
