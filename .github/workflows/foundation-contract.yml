name: Foundation Contract

on:
  push:
    branches:
      - main
      - integration/**
      - feat/**
  pull_request:

concurrency:
  group: foundation-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Core foundation contract
        run: python integration/validate_contract.py
