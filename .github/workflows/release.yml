name: Create Foundation Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Foundation version without v prefix (for example 1.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce requested version matches project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(./gradlew -q properties | awk -F': ' '$1 == "version" { print $2; exit }')"
          REQUESTED_VERSION="${{ inputs.version }}"
          if [[ "${REQUESTED_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Requested version ${REQUESTED_VERSION} does not match project version ${PROJECT_VERSION}."
            exit 1
          fi
          echo "tag=v${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Refusing to overwrite an immutable release."
            exit 1
          fi

      - name: Verify release candidate
        run: ./gradlew clean test publishToMavenLocal

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "AS Academy Foundation ${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
