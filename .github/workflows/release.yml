name: Create Foundation Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable Foundation version without v prefix (for example 1.5.0)'
        required: true
        type: string
      release_ref:
        description: 'Exact immutable commit SHA to release'
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.actor == github.repository_owner && startsWith(github.event.issue.title, 'release:'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_REF: ${{ inputs.release_ref }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_VERSION}"
            RELEASE_REF="${DISPATCH_REF}"
          else
            REQUEST="${ISSUE_TITLE#release:}"
            VERSION="${REQUEST%%@*}"
            RELEASE_REF="${REQUEST#*@}"
            if [[ "${VERSION}" == "${REQUEST}" || "${RELEASE_REF}" == "${REQUEST}" ]]; then
              echo "Issue title must be release:<x.y.z>@<40-char-sha>."
              exit 1
            fi
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable x.y.z versions can be released."
            exit 1
          fi
          if [[ ! "${RELEASE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_ref must be an exact 40-character commit SHA."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_ref=${RELEASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.release_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce requested version matches release commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(./gradlew -q properties | awk -F': ' '$1 == "version" { print $2; exit }')"
          REQUESTED_VERSION="${{ steps.request.outputs.version }}"
          EXPECTED_SHA="${{ steps.request.outputs.release_ref }}"
          if [[ "${PROJECT_VERSION}" == *-SNAPSHOT ]]; then
            echo "Snapshot project version ${PROJECT_VERSION} cannot be released."
            exit 1
          fi
          if [[ "${REQUESTED_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Requested version ${REQUESTED_VERSION} does not match release commit version ${PROJECT_VERSION}."
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "Checkout resolved to ${ACTUAL_SHA}, expected immutable SHA ${EXPECTED_SHA}."
            exit 1
          fi
          echo "tag=v${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Refusing to overwrite an immutable release."
            exit 1
          fi

      - name: Verify release candidate
        run: ./gradlew clean test publishToMavenLocal

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ steps.version.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "AS Academy Foundation ${TAG}" "${SHA}"
          git push origin "refs/tags/${TAG}"

      - name: Close successful release request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Release request completed: ${{ steps.version.outputs.tag }} at ${{ steps.version.outputs.sha }}."
